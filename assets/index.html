<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Team App</title>
    <script src="theme.js"></script>
    <script src="standalone.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="loadbar" class="loadbar" aria-hidden="true"></div>
    <div id="app" class="app" aria-busy="true">
      <div class="topbar">
        <span class="brand"><span class="mark"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/></svg></span>GitHub Team App</span>
        <span class="sk sk-chip" aria-hidden="true"></span>
        <span class="spacer"></span>
        <span class="sk sk-chip"></span>
        <span class="sk sk-btn"></span>
        <span class="sk sk-btn"></span>
        <span class="sk sk-btn"></span>
      </div>
      <div class="subbar">
        <span class="sk sk-who"></span>
        <span class="sk sk-meta"></span>
        <span class="stats"><span class="sk sk-stat"></span><span class="sk sk-stat"></span><span class="sk sk-stat"></span></span>
      </div>
      <div class="lanes">
        <section class="lane">
          <div class="lane-head"><span class="sk sk-dot"></span><span class="sk sk-lane-title"></span></div>
          <div class="grid"><span class="sk sk-card"></span><span class="sk sk-card"></span><span class="sk sk-card"></span></div>
        </section>
        <section class="lane">
          <div class="lane-head"><span class="sk sk-dot"></span><span class="sk sk-lane-title"></span></div>
          <div class="grid"><span class="sk sk-card"></span><span class="sk sk-card"></span></div>
        </section>
      </div>
    </div>
    <aside class="status-popups" aria-label="Status updates">
      <section id="sync-progress" class="sync-progress" hidden aria-label="Repository synchronization">
        <div id="sync-progress-status" role="status" aria-live="polite" aria-atomic="true"></div>
        <progress id="sync-progress-bar" aria-label="Repository sync phase"></progress>
        <p id="sync-progress-detail" class="sync-progress-detail"></p>
      </section>
      <div id="toast-list" aria-live="polite" aria-relevant="additions"></div>
    </aside>
    <script src="app.js"></script>
  </body>
</html>
